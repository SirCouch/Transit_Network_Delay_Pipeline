[project]
name = "transit-network-delay-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "google-api-core>=2.19.0",
    "google-cloud-bigquery>=3.25.0",
    "google-cloud-storage>=2.18.0",
    "gtfs-realtime-bindings>=1.0.0",
    "httpx>=0.27.0",
    "joblib>=1.4.0",
    "lightgbm>=4.5.0",
    "pandas>=2.2.0",
    "pydantic>=2.8.0",
    "pyarrow>=16.0.0",
    "requests>=2.32.0",
    "scikit-learn>=1.5.0",
    "streamlit>=1.37.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 96
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "app*", "pipeline*"]
